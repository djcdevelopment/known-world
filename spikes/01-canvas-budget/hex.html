<!doctype html>
<html><head><meta charset="utf-8"><title>hex</title>
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}canvas{display:block;width:1920px;height:1080px}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const N=parseInt(new URLSearchParams(location.search).get('n')||'5000',10);
const W=1920,H=1080,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const rnd=mulberry32(12345);
// axial grid: roughly square-ish arrangement of N tiles
const cols=Math.ceil(Math.sqrt(N*W/H)), rows=Math.ceil(N/cols);
const size=Math.max(1.5,Math.min(W/(cols*1.7321+1),H/(rows*1.5+0.5)));
const tiles=[];
for(let i=0;i<N;i++){
  const r=Math.floor(i/cols), q=(i%cols)-Math.floor(r/2);
  const x=size*Math.sqrt(3)*(q+r/2)+size*1.2, y=size*1.5*r+size*1.2;
  const u=rnd();
  tiles.push({x,y,hue:Math.floor(rnd()*360),a:0.4+rnd()*0.6,st:u<0.1?2:(u<0.7?1:0)});
}
const flashes=[];for(let i=0;i<200;i++){const t=tiles[Math.floor(rnd()*N)];flashes.push({x:t.x,y:t.y,r:20+rnd()*60,hue:Math.floor(rnd()*360),ph:rnd()})}
const hexOff=[];for(let k=0;k<6;k++){const a=Math.PI/180*(60*k-30);hexOff.push([Math.cos(a),Math.sin(a)])}
function render(t){
  const t0=performance.now();
  ctx.fillStyle='#0b0e14';ctx.fillRect(0,0,W,H);
  for(let i=0;i<N;i++){
    const T=tiles[i];if(T.st===0)continue;
    ctx.beginPath();
    for(let k=0;k<6;k++){const px=T.x+hexOff[k][0]*size*0.95,py=T.y+hexOff[k][1]*size*0.95;k?ctx.lineTo(px,py):ctx.moveTo(px,py)}
    ctx.closePath();
    ctx.fillStyle=T.st===2?`hsla(${T.hue},80%,60%,${T.a})`:`hsla(${T.hue},30%,28%,${T.a*0.6})`;
    ctx.fill();
  }
  for(const f of flashes){
    const p=(t*0.5+f.ph)%1, r=f.r*(0.5+p);
    const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,r);
    g.addColorStop(0,`hsla(${f.hue},100%,80%,${0.8*(1-p)})`);g.addColorStop(1,`hsla(${f.hue},100%,50%,0)`);
    ctx.fillStyle=g;ctx.fillRect(f.x-r,f.y-r,2*r,2*r);
  }
  ctx.strokeStyle='#c9a227';ctx.lineWidth=6;ctx.strokeRect(3,3,W-6,H-6);
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(20,20,420,12*22+16);
  ctx.fillStyle='#e8e0c0';ctx.font='16px monospace';
  for(let i=0;i<12;i++)ctx.fillText(`tally ${String(i).padStart(2,'0')}: ${(Math.floor(t*100)*(i+7))%100000}  tiles=${N}`,30,42+i*22);
  const day=Math.floor(t*30);ctx.font='28px monospace';
  ctx.fillText(`AD ${800+Math.floor(day/365)}-${String(1+Math.floor(day%365/31)).padStart(2,'0')}-${String(1+day%28).padStart(2,'0')}`,W-300,H-30);
  return performance.now()-t0;
}
window.__kwFrame=function(n){return render(n/30)};
</script></body></html>
